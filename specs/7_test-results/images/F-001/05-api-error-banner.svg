<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
    </style>
    <filter id="shadow-md">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.08)"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.05)"/>
    </filter>
  </defs>
  
  <rect width="900" height="640" fill="#F1F5F9"/>
  <rect x="225" y="60" width="450" height="500" rx="8" ry="8" fill="#FFFFFF" filter="url(#shadow-md)"/>

    <text x="245" y="118" font-size="28" font-weight="700" fill="#0F172A">🃏 Scrum Poker</text>
    <text x="245" y="145" font-size="13" fill="#64748B">Estimate together. Reveal at once.</text>

    <!-- API error banner -->
    <rect x="245" y="162" width="410" height="48" rx="8" ry="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1"/>
    <text x="260" y="191" font-size="13" fill="#0F172A">⚠️ Something went wrong. Please try again.</text>
    <text x="637" y="191" font-size="16" fill="#64748B" text-anchor="middle">×</text>

    
    <text x="245" y="222" font-size="14" font-weight="600" fill="#0F172A">Your display name *</text>
    <rect x="245" y="232" width="410" height="44" rx="8" ry="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="257" y="259" font-size="14" fill="#0F172A">Alice</text>
  
    
    <text x="245" y="317" font-size="14" font-weight="600" fill="#0F172A">First story title (optional)</text>
    <rect x="245" y="327" width="410" height="44" rx="8" ry="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="257" y="354" font-size="14" fill="#64748B">e.g. US-101 Login page</text>
  
    
    <rect x="245" y="420" width="410" height="44" rx="8" ry="8" fill="#4F46E5" opacity="1"/>
    <text x="450" y="447" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Create game</text>
  
  

</svg>