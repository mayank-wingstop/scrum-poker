name: Stage Gate — Trigger Architecture Agent

on:
  push:
    branches: [main]
    paths:
      - 'specs/2_design/F-*.MD'

jobs:
  trigger-architecture:
    name: Create Architecture Issue for Approved Design
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect merged design files
        id: detect
        run: |
          CHANGED=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'specs/2_design/F-*.MD' | tr '\n' ' ' | xargs)
          echo "changed_files=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Create Architecture Issues
        if: steps.detect.outputs.changed_files != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CHANGED: ${{ steps.detect.outputs.changed_files }}
        run: |
          for FILE in $CHANGED; do
            FEATURE_ID=$(basename "$FILE" .MD)
            BODY="## Architecture Stage Task

**Feature:** ${FEATURE_ID}
**Agent:** architecture-specialist (see .github/agents/architecture-specialist.agent.md)

### Instructions
Read and follow the agent definition in .github/agents/architecture-specialist.agent.md exactly.

**Reads:** specs/SYSTEM.MD, specs/DESIGN.MD, specs/ARCHITECTURE.MD, specs/2_design/${FEATURE_ID}.MD
**Writes:** specs/3_architecture/${FEATURE_ID}.MD, updates specs/ARCHITECTURE.MD, updates specs/INDEX.MD

Open a pull request with your output. Human approval required before merge.

---
Auto-created by TADF stage-gate workflow on merge of ${FILE}."

            gh issue create \
              --repo "$REPO" \
              --title "[${FEATURE_ID}] Architecture Stage" \
              --assignee "mayank-wingstop" \
              --label "tadf-stage-3" \
              --body "$BODY"
          done
